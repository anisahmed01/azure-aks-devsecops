apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  namespace: devsecops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio
  template:
    metadata:
      labels:
        app: portfolio
    spec:
      containers:
        - name: portfolio
          image: aneesazuredevopsacr.azurecr.io/complete-azure-devops:10
          ports:
            - containerPort: 5000
